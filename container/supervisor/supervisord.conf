[supervisord]
nodaemon=true
logfile=/var/log/pi-computer/supervisord.log
pidfile=/var/run/pi-computer/supervisord.pid
childlogdir=/var/log/pi-computer
loglevel=info

[program:xvfb]
command=/usr/bin/Xvfb %(ENV_DISPLAY)s -screen 0 %(ENV_SCREEN_WIDTH)sx%(ENV_SCREEN_HEIGHT)sx%(ENV_SCREEN_DEPTH)s -nolisten tcp -ac
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/pi-computer/xvfb.log
stderr_logfile=/var/log/pi-computer/xvfb.err.log

[program:fluxbox]
command=/usr/local/bin/pi-computer-wait-and-run fluxbox /usr/bin/fluxbox
autostart=true
autorestart=true
priority=20
environment=DISPLAY="%(ENV_DISPLAY)s",HOME="%(ENV_HOME)s"
stdout_logfile=/var/log/pi-computer/fluxbox.log
stderr_logfile=/var/log/pi-computer/fluxbox.err.log

[program:vnc-loopback]
command=/usr/local/bin/pi-computer-vnc-loopback
autostart=true
autorestart=true
priority=30
environment=DISPLAY="%(ENV_DISPLAY)s",HOME="%(ENV_HOME)s",VNC_PORT="%(ENV_VNC_PORT)s"
stdout_logfile=/var/log/pi-computer/vnc-loopback.log
stderr_logfile=/var/log/pi-computer/vnc-loopback.err.log

[program:novnc-backend]
command=/usr/local/bin/pi-computer-wait-and-run novnc-backend /usr/share/novnc/utils/novnc_proxy --listen 127.0.0.1:%(ENV_NOVNC_BACKEND_PORT)s --vnc 127.0.0.1:%(ENV_VNC_PORT)s --web /usr/share/novnc
autostart=true
autorestart=true
priority=40
environment=HOME="%(ENV_HOME)s"
stdout_logfile=/var/log/pi-computer/novnc-backend.log
stderr_logfile=/var/log/pi-computer/novnc-backend.err.log

[program:novnc-auth-gate]
command=/usr/bin/node /opt/pi-computer/novnc-gate/server.js
autostart=true
autorestart=true
priority=45
environment=HOME="%(ENV_HOME)s",NOVNC_PORT="%(ENV_NOVNC_PORT)s",NOVNC_BACKEND_PORT="%(ENV_NOVNC_BACKEND_PORT)s",PI_COMPUTER_NOVNC_TOKEN="%(ENV_PI_COMPUTER_NOVNC_TOKEN)s",PI_COMPUTER_NOVNC_USERNAME="%(ENV_PI_COMPUTER_NOVNC_USERNAME)s",PI_COMPUTER_NOVNC_PASSWORD="%(ENV_PI_COMPUTER_NOVNC_PASSWORD)s"
stdout_logfile=/var/log/pi-computer/novnc-auth-gate.log
stderr_logfile=/var/log/pi-computer/novnc-auth-gate.err.log

[program:opera]
command=/usr/local/bin/pi-computer-start-opera
autostart=true
autorestart=true
priority=50
environment=DISPLAY="%(ENV_DISPLAY)s",HOME="%(ENV_HOME)s",XDG_CONFIG_HOME="%(ENV_XDG_CONFIG_HOME)s",XDG_CACHE_HOME="%(ENV_XDG_CACHE_HOME)s",CDP_HOST="%(ENV_CDP_HOST)s",CDP_PORT="%(ENV_CDP_PORT)s"
stdout_logfile=/var/log/pi-computer/opera.log
stderr_logfile=/var/log/pi-computer/opera.err.log

[program:api]
command=/usr/bin/node /opt/pi-computer/api/server.js
autostart=true
autorestart=true
priority=60
environment=HOME="%(ENV_HOME)s",API_HOST="%(ENV_API_HOST)s",API_PORT="%(ENV_API_PORT)s",PI_COMPUTER_API_TOKEN="%(ENV_PI_COMPUTER_API_TOKEN)s",PI_COMPUTER_TASK_STORE="%(ENV_PI_COMPUTER_TASK_STORE)s",BROWSER_MCP_TRANSPORT="%(ENV_BROWSER_MCP_TRANSPORT)s",CDP_HOST="%(ENV_CDP_HOST)s",CDP_PORT="%(ENV_CDP_PORT)s"
stdout_logfile=/var/log/pi-computer/api.log
stderr_logfile=/var/log/pi-computer/api.err.log
