[supervisord]
nodaemon=true
logfile=%(ENV_PI_COMPUTER_LOG_DIR)s/supervisord.log
pidfile=/var/run/pi-computer/supervisord.pid
childlogdir=%(ENV_PI_COMPUTER_LOG_DIR)s
loglevel=info

[program:xvfb]
command=/usr/bin/Xvfb %(ENV_DISPLAY)s -screen 0 %(ENV_SCREEN_WIDTH)sx%(ENV_SCREEN_HEIGHT)sx%(ENV_SCREEN_DEPTH)s -nolisten tcp -ac
autostart=true
autorestart=true
priority=10
stdout_logfile=%(ENV_PI_COMPUTER_LOG_DIR)s/xvfb.log
stderr_logfile=%(ENV_PI_COMPUTER_LOG_DIR)s/xvfb.err.log

[program:fluxbox]
command=/usr/local/bin/pi-computer-wait-and-run fluxbox /usr/bin/fluxbox
autostart=true
autorestart=true
priority=20
environment=DISPLAY="%(ENV_DISPLAY)s",HOME="%(ENV_HOME)s"
stdout_logfile=%(ENV_PI_COMPUTER_LOG_DIR)s/fluxbox.log
stderr_logfile=%(ENV_PI_COMPUTER_LOG_DIR)s/fluxbox.err.log

[program:vnc-loopback]
command=/usr/local/bin/pi-computer-vnc-loopback
autostart=true
autorestart=true
priority=30
environment=DISPLAY="%(ENV_DISPLAY)s",HOME="%(ENV_HOME)s",VNC_PORT="%(ENV_VNC_PORT)s"
stdout_logfile=%(ENV_PI_COMPUTER_LOG_DIR)s/vnc-loopback.log
stderr_logfile=%(ENV_PI_COMPUTER_LOG_DIR)s/vnc-loopback.err.log

[program:novnc-backend]
command=/usr/local/bin/pi-computer-wait-and-run novnc-backend /usr/share/novnc/utils/novnc_proxy --listen 127.0.0.1:%(ENV_NOVNC_BACKEND_PORT)s --vnc 127.0.0.1:%(ENV_VNC_PORT)s --web /usr/share/novnc
autostart=true
autorestart=true
priority=40
environment=HOME="%(ENV_HOME)s"
stdout_logfile=%(ENV_PI_COMPUTER_LOG_DIR)s/novnc-backend.log
stderr_logfile=%(ENV_PI_COMPUTER_LOG_DIR)s/novnc-backend.err.log

[program:novnc-proxy]
command=/usr/local/bin/node /opt/pi-computer/novnc-gate/server.js
autostart=true
autorestart=true
priority=45
environment=HOME="%(ENV_HOME)s",NOVNC_PORT="%(ENV_NOVNC_PORT)s",NOVNC_BACKEND_PORT="%(ENV_NOVNC_BACKEND_PORT)s"
stdout_logfile=%(ENV_PI_COMPUTER_LOG_DIR)s/novnc-proxy.log
stderr_logfile=%(ENV_PI_COMPUTER_LOG_DIR)s/novnc-proxy.err.log

[program:opera]
command=/usr/local/bin/pi-computer-start-opera
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
priority=50
environment=DISPLAY="%(ENV_DISPLAY)s",HOME="%(ENV_HOME)s",XDG_CONFIG_HOME="%(ENV_XDG_CONFIG_HOME)s",XDG_CACHE_HOME="%(ENV_XDG_CACHE_HOME)s",XDG_DATA_HOME="%(ENV_XDG_DATA_HOME)s",CDP_HOST="%(ENV_CDP_HOST)s",CDP_PORT="%(ENV_CDP_PORT)s",PI_COMPUTER_LOG_DIR="%(ENV_PI_COMPUTER_LOG_DIR)s",OPERA_PROFILE_DIR="%(ENV_OPERA_PROFILE_DIR)s",OPERA_FROZEN_PROFILE_DIR="%(ENV_OPERA_FROZEN_PROFILE_DIR)s",OPERA_HOST_PROFILE_SOURCE_DIR="%(ENV_OPERA_HOST_PROFILE_SOURCE_DIR)s"
stdout_logfile=%(ENV_PI_COMPUTER_LOG_DIR)s/opera.log
stderr_logfile=%(ENV_PI_COMPUTER_LOG_DIR)s/opera.err.log

[program:api]
command=/usr/local/bin/pi-computer-start-api
autostart=true
autorestart=true
priority=60
environment=HOME="%(ENV_HOME)s",API_HOST="%(ENV_API_HOST)s",API_PORT="%(ENV_API_PORT)s",PI_COMPUTER_TASK_STORE="%(ENV_PI_COMPUTER_TASK_STORE)s",PI_COMPUTER_LOG_DIR="%(ENV_PI_COMPUTER_LOG_DIR)s",BROWSER_MCP_TRANSPORT="%(ENV_BROWSER_MCP_TRANSPORT)s",CDP_HOST="%(ENV_CDP_HOST)s",CDP_PORT="%(ENV_CDP_PORT)s",PI_HARNESS_BIN="%(ENV_PI_HARNESS_BIN)s",PI_HARNESS_MCP_CONFIG="%(ENV_PI_HARNESS_MCP_CONFIG)s",PI_HARNESS_PROVIDER="%(ENV_PI_HARNESS_PROVIDER)s",PI_HARNESS_MODEL="%(ENV_PI_HARNESS_MODEL)s",PI_HARNESS_SESSION_DIR="%(ENV_PI_HARNESS_SESSION_DIR)s",PI_HARNESS_MAX_INSTRUCTION_CHARS="%(ENV_PI_HARNESS_MAX_INSTRUCTION_CHARS)s",PI_BROWSER_TASK_MAX_ARTICLES="%(ENV_PI_BROWSER_TASK_MAX_ARTICLES)s",PI_HOST_AUTH_DIR="%(ENV_PI_HOST_AUTH_DIR)s"
stdout_logfile=%(ENV_PI_COMPUTER_LOG_DIR)s/api.log
stderr_logfile=%(ENV_PI_COMPUTER_LOG_DIR)s/api.err.log
