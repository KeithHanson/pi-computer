services:
  pi-computer:
    build:
      context: .
      dockerfile: Dockerfile
    image: pi-computer:local
    init: true
    shm_size: "1gb"
    ports:
      - "127.0.0.1:6080:6080"
    volumes:
      - pi-computer-home:/home/pi
    environment:
      SCREEN_WIDTH: "1280"
      SCREEN_HEIGHT: "800"
      SCREEN_DEPTH: "24"
      NOVNC_PORT: "6080"
      VNC_PORT: "5900"
      VNC_LISTEN: "127.0.0.1"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  pi-computer-home:
