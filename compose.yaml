services:
  pi-computer:
    build:
      context: .
      dockerfile: Dockerfile
    image: pi-computer:local
    init: true
    user: "1000:1000"
    read_only: true
    shm_size: "1gb"
    pids_limit: 512
    mem_limit: "2g"
    cpus: "2.0"
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777
      - /run:rw,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=0755
      - /var/log/pi-computer:rw,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=0755
      - /var/run/pi-computer:rw,nosuid,nodev,size=16m,uid=1000,gid=1000,mode=0755
    ports:
      - "${NOVNC_HOST_BIND:-127.0.0.1}:${NOVNC_HOST_PORT:-6080}:6080"
      - "${API_HOST_BIND:-127.0.0.1}:${API_HOST_PORT:-8080}:8080"
    volumes:
      - pi-computer-home:/home/pi
      - type: bind
        source: ${PI_HARNESS_HOST_AGENT_DIR:-./container/pi-agent-import-empty}
        target: /pi-agent-import
        read_only: true
    environment:
      SCREEN_WIDTH: "1280"
      SCREEN_HEIGHT: "800"
      SCREEN_DEPTH: "24"
      NOVNC_PORT: "6080"
      NOVNC_BACKEND_PORT: "6081"
      VNC_PORT: "5900"
      CDP_HOST: "127.0.0.1"
      CDP_PORT: "9222"
      BROWSER_MCP_TRANSPORT: "stdio"
      API_HOST: "0.0.0.0"
      API_PORT: "8080"
      PI_COMPUTER_TASK_STORE: "/home/pi/pi-computer/tasks"
      PI_BOOTSTRAP_AGENT_IMPORT_DIR: "/pi-agent-import"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_BASE_URL: ${AZURE_OPENAI_BASE_URL:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      TOGETHER_API_KEY: ${TOGETHER_API_KEY:-}
      FIREWORKS_API_KEY: ${FIREWORKS_API_KEY:-}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      PI_PROVIDER: ${PI_PROVIDER:-}
      PI_MODEL: ${PI_MODEL:-}
    security_opt:
      - no-new-privileges:true
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
      net.ipv6.conf.default.disable_ipv6: "1"
    restart: unless-stopped

volumes:
  pi-computer-home:
