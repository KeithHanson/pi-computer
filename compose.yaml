services:
  pi-computer:
    build:
      context: .
      dockerfile: Dockerfile
    image: pi-computer:local
    init: true
    user: "1000:1000"
    read_only: true
    shm_size: "1gb"
    pids_limit: 512
    mem_limit: "2g"
    cpus: "2.0"
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777
      - /run:rw,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=0755
      - /var/log/pi-computer:rw,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=0755
      - /var/run/pi-computer:rw,nosuid,nodev,size=16m,uid=1000,gid=1000,mode=0755
    ports:
      - "${NOVNC_HOST_BIND:-127.0.0.1}:${NOVNC_HOST_PORT:-6080}:6080"
      - "${API_HOST_BIND:-127.0.0.1}:${API_HOST_PORT:-8080}:8080"
    volumes:
      - pi-computer-home:/home/pi
    environment:
      SCREEN_WIDTH: "1280"
      SCREEN_HEIGHT: "800"
      SCREEN_DEPTH: "24"
      NOVNC_PORT: "6080"
      NOVNC_BACKEND_PORT: "6081"
      PI_COMPUTER_NOVNC_TOKEN: "${PI_COMPUTER_NOVNC_TOKEN:-local-novnc-token-change-me}"
      PI_COMPUTER_NOVNC_USERNAME: "${PI_COMPUTER_NOVNC_USERNAME:-operator}"
      PI_COMPUTER_NOVNC_PASSWORD: "${PI_COMPUTER_NOVNC_PASSWORD:-}"
      VNC_PORT: "5900"
      CDP_HOST: "127.0.0.1"
      CDP_PORT: "9222"
      BROWSER_MCP_TRANSPORT: "stdio"
      API_HOST: "0.0.0.0"
      API_PORT: "8080"
      PI_COMPUTER_API_TOKEN: "${PI_COMPUTER_API_TOKEN:-local-dev-token-change-me}"
      PI_COMPUTER_TASK_STORE: "/home/pi/pi-computer/tasks"
    security_opt:
      - no-new-privileges:true
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
      net.ipv6.conf.default.disable_ipv6: "1"
    restart: unless-stopped

volumes:
  pi-computer-home:
